services:
    lobby:
        restart: always
        build: .
        image: keyteki
        ports:
            - '4000:4000'
            - '9229:9229'
        volumes:
            - './client:/usr/src/app/client'
            - './server:/usr/src/app/server'
            - './public:/usr/src/app/public'
            - './less:/usr/src/app/less'
            - './config:/usr/src/app/config'
        links:
            - postgres
            - redis
        depends_on:
            # Ready, not just started, as the lobby runs the migrations first
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - NODE_APP_INSTANCE=docker
            - NODE_ENV=development
            - REDIS_URL=redis://redis:6379
        # Apply any pending migrations and add the development users before starting
        command:
            - sh
            - -c
            - node server/db/migrate.js up && node server/scripts/seeddevusers.js && exec node --inspect=0.0.0.0:9229 .
    node:
        restart: always
        build: .
        ports:
            - '9500:9500'
            - '9339:9339'
        volumes:
            - './server:/usr/src/app/server'
            - './config:/usr/src/app/config'
        links:
            - redis
        depends_on:
            - redis
        command:
            - node
            - '--inspect=0.0.0.0:9339'
            - 'server/gamenode'
        environment:
            - NODE_APP_INSTANCE=docker
            - NODE_ENV=development
            - REDIS_URL=redis://redis:6379
    postgres:
        # Keep on the same major version as production and the CI database job
        image: postgres:16
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-keyteki}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changemeplease}
        ports:
            - '54320:5432'
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped
    redis:
        image: 'redis:alpine'
        command: redis-server
        ports:
            - '6379:6379'
        volumes:
            - $PWD/redis-data:/var/lib/redis
            - $PWD/redis.conf:/usr/local/etc/redis/redis.conf
        environment:
            - REDIS_REPLICATION_MODE=master
volumes:
    postgres:
    node_modules:
