# The migrate job's config. A hook of its own because keyteki-lobby-secret is only updated after the
# pre-upgrade hooks have run, so the job would otherwise see the previous release's config
apiVersion: v1
kind: Secret
metadata:
    name: keyteki-migrate-secret
    # prettier-ignore
    namespace: {{ .Values.namespace }}
    annotations:
        'helm.sh/hook': pre-install,pre-upgrade
        'helm.sh/hook-weight': '-1'
        'helm.sh/hook-delete-policy': before-hook-creation
type: Opaque
stringData:
    # prettier-ignore
    node_config: {{ .Values.nodeConfig | toJson | quote }}
