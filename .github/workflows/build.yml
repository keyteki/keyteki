# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build, test and package
on:
    push:
        branches: ['master', 'pack/**']
        paths-ignore:
            - '.github/workflows/**'
            - 'infrastructure/**'
    pull_request:
        branches: ['master', 'pack/**']
        paths-ignore:
            - '.github/workflows/**'
            - 'infrastructure/**'
    workflow_dispatch: {}

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - name: Checkout source and submodules
              uses: actions/checkout@v3
              with:
                  fetch-depth: '0'
                  submodules: recursive
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - name: Use npm 11
              run: npm install -g npm@11.6.0
            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v0.9.14
              with:
                  versionSpec: 5.x
            - id: determine_version
              name: Determine Version
              uses: gittools/actions/gitversion/execute@v0.9.14
              with:
                  additionalArguments: /overrideconfig mode=Mainline
            - run: npm ci --include=optional
            - name: Typecheck client
              run: npm run typecheck:client
            - run: npm run lint
            - name: Build client
              env:
                  VERSION: ${{ steps.determine_version.outputs.semVer }}
                  # Public hCaptcha site key used by the frontend widget
                  HCAPTCHA_SITEKEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
                  VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
                  VITE_VERSION: ${{ steps.determine_version.outputs.semVer }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: npm run build --if-present
            - run: npm test
    database:
        runs-on: ubuntu-latest
        services:
            postgres:
                # Keep on the same major version as production and docker-compose.yml
                image: postgres:16
                env:
                    POSTGRES_USER: keyteki
                    POSTGRES_PASSWORD: keyteki
                    POSTGRES_DB: keyteki
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            NODE_CONFIG: '{"dbHost":"localhost","dbPort":5432,"dbDatabase":"keyteki","dbUser":"keyteki","dbPassword":"keyteki"}'
        steps:
            - name: Checkout source and submodules
              uses: actions/checkout@v4
              with:
                  fetch-depth: '0'
                  submodules: recursive
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'npm'
            - run: npm ci
            - name: Check merged migrations are unchanged
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  changed=$(git diff --diff-filter=MDR --name-only origin/${{ github.base_ref }}...HEAD -- server/db/migrations server/db/baseline.sql)
                  if [ -n "$changed" ]; then
                      echo "::error::Migrations that are already merged must not be changed, add a new migration instead:"
                      echo "$changed"
                      exit 1
                  fi
            - name: Apply all migrations to an empty database
              run: npm run db:migrate
            - name: Revert all migrations
              run: npm run db:migrate:down -- all
            - name: Re-apply all migrations
              run: npm run db:migrate
            - name: Check server/db/schema.sql is up to date
              run: |
                  docker exec ${{ job.services.postgres.id }} pg_dump -U keyteki --schema-only --no-owner --no-privileges keyteki | node ./server/db/dump-schema.js --stdin
                  # status rather than diff, so a schema.sql that was never committed also fails
                  if [ -n "$(git status --porcelain -- server/db/schema.sql)" ]; then
                      git diff -- server/db/schema.sql
                      echo "::error::server/db/schema.sql does not match the migrations, run 'npm run db:schema:dump' and commit the result"
                      exit 1
                  fi
            - name: Create the test database
              run: docker exec ${{ job.services.postgres.id }} createdb -U keyteki keyteki_test
            - name: Database integration tests
              env:
                  # No database here, so config/test.json5 picks keyteki_test
                  NODE_CONFIG: '{"dbHost":"localhost","dbPort":5432,"dbUser":"keyteki","dbPassword":"keyteki"}'
              run: npm run test:db
    package:
        name: Push Package
        if: ${{ github.repository == 'keyteki/keyteki' && (github.ref_name == 'master' || startsWith(github.ref_name, 'pack/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest
        needs: ['build', 'database']
        steps:
            - name: Checkout source and submodules
              uses: actions/checkout@v3
              with:
                  fetch-depth: '0'
                  submodules: recursive
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v0.9.14
              with:
                  versionSpec: 5.x
            - id: determine_version
              name: Determine Version
              uses: gittools/actions/gitversion/execute@v0.9.14
              with:
                  additionalArguments: /overrideconfig mode=Mainline
            - name: Determine image tags
              id: tags
              # sha-<commit> is what Auto Deploy to Development deploys, so it runs exactly this build
              run: |
                  if [ "${{ github.ref_name }}" = "master" ]; then
                    CHANNEL=latest
                  else
                    CHANNEL=dev
                  fi
                  for IMAGE in lobby node; do
                    echo "$IMAGE=cryogen/keyteki-$IMAGE:$CHANNEL,cryogen/keyteki-$IMAGE:${{ steps.determine_version.outputs.semVer }},cryogen/keyteki-$IMAGE:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
                  done
            - name: Build and push lobby
              uses: docker/build-push-action@v3
              with:
                  build-args: |
                      # Public hCaptcha site key compiled into the client bundle
                      HCAPTCHA_SITEKEY=${{ secrets.HCAPTCHA_SITE_KEY }}
                      VERSION=${{ steps.determine_version.outputs.semVer }}
                      SENTRY_DSN=${{ secrets.SENTRY_DSN }}
                      SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                  push: true
                  tags: ${{ steps.tags.outputs.lobby }}
            - name: Build and push node
              uses: docker/build-push-action@v3
              with:
                  build-args: |
                      "VERSION=${{ steps.determine_version.outputs.semVer }}"
                  push: true
                  file: server/gamenode/Dockerfile
                  tags: ${{ steps.tags.outputs.node }}
